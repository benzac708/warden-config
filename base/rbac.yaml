apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-read
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-read
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: warden
    namespace: apps
roleRef:
  kind: Role
  name: warden-read
  apiGroup: rbac.authorization.k8s.io
