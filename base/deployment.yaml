apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warden
  template:
    metadata:
      labels:
        app: warden
    spec:
      serviceAccountName: warden
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: warden-agent
          image: ghcr.io/benzac708/warden:3119f406b42d5208643e7acfafd1a65a190b01a5
          command: ["python", "-m", "warden.cli", "agent"]
          env:
            - name: WARDEN_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: warden-llm
                  key: api-key
            - name: WARDEN_LLM_MODEL
              value: qwen/qwen3.8-27b
            - name: WARDEN_REPORT_PATH
              value: /var/www/warden/report.json
            - name: WARDEN_METRICS_PORT
              value: "8000"
            - name: WARDEN_MAX_STEPS
              value: "4"
            - name: WARDEN_INTERVAL_SECONDS
              value: "900"
            - name: WARDEN_TOKEN_BUDGET
              value: "12000"
          ports:
            - name: metrics
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: www
              mountPath: /var/www/warden
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

        - name: warden-showcase
          image: ghcr.io/benzac708/warden:3119f406b42d5208643e7acfafd1a65a190b01a5
          command: ["python", "-m", "warden.cli", "serve"]
          env:
            - name: WARDEN_SERVE_PORT
              value: "8080"
            - name: WARDEN_REPORT_PATH
              value: /var/www/warden/report.json
            - name: WARDEN_PAGE_PATH
              value: /www/index.html
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: www
              mountPath: /var/www/warden
            - name: page
              mountPath: /www/index.html
              subPath: index.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      volumes:
        - name: www
          emptyDir: {}
        - name: page
          configMap:
            name: warden-page
