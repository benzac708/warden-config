# Argo CD Application: Grafana Loki (single-binary) in the monitoring namespace.
# Multi-source: the Helm chart comes from the Grafana repo, values from this repo.
# Apply once: kubectl apply -f loki/app-loki.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.6.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/loki/loki-values.yaml
    - repoURL: https://github.com/benzac708/warden-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true