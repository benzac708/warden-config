# Grafana datasource for Loki. Applied into the monitoring namespace.
# kube-prometheus-stack's Grafana sidecar picks up ConfigMaps labeled
# grafana_datasource: "1" and loads them automatically.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: true